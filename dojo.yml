id: industrial-control-systems
name: Industrial Control Systems
description: Challenges covering security concepts in Industrial Control Systems.

modules:
  - id: introduction-to-ics
    name: Introduction to ICS
    description: Learn the fundamentals of Industrial Control Systems.
    challenges:
      - id: ics-basics
        name: ICS Basics
        description: Complete an introductory Industrial Control Systems challenge.

      - id: openplc-register-control
        name: OpenPLC Register Control
        description: Read and write PLC registers to activate an industrial process.

      - id: plc-safety-interlock
        name: PLC Safety Interlock
        description: Analyze PLC registers and satisfy multiple safety conditions to activate an industrial pump.

      - id: modbus-plc-control
        name: Modbus PLC Control
        description: Use Modbus TCP to inspect and modify PLC holding registers to activate an industrial pump.
